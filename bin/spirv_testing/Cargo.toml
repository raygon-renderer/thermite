[package]
name = "spirv_testing"
version = "0.1.0"
edition = "2024"
publish = false # dev tool: SPIR-V shader test library, depends on a local rust-gpu checkout

[lints]
workspace = true

[lib]
doc = false

# No [lib] crate-type — spirv-builder overrides it to `dylib` when compiling for SPIR-V.
# Explicitly setting crate-type = ["lib"] here can interfere with that.

[dependencies]
const-default = { version = "1", default-features = false, features = ["derive"] }
spirv-std-macros.workspace = true
thermite = { path = "../../crates/thermite", default-features = false, features = ["spirv", "ignore_denormals", "disable_dispatch"] }
thermite-special = { path = "../../crates/thermite-special", default-features = false, features = ["disable_dispatch"] }
