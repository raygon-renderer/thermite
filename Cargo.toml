[workspace]
members = ["bin/*", "crates/*"]
resolver = "3"

[workspace.lints.rust]
unexpected_cfgs = { level = "allow", check-cfg = ['cfg(target_arch, values("spirv"))', 'cfg(tarpaulin_include)'] }

[profile.dev]
opt-level = 1

[profile.release]
opt-level = 3
codegen-units = 1
lto = true

[profile.bench]
opt-level = 3
lto = "fat"
codegen-units = 1
debug = false

[profile.release-ffi]
inherits = "release"
opt-level = 3
codegen-units = 1
lto = "fat"
debug = false
strip = true
panic = "abort"

[workspace.dependencies]
spirv-builder = { version = "*" }
spirv-std-macros = { version = "*" }

# spirv-builder = { path = "F:/bin/rust-gpu/crates/spirv-builder", version = "*" }
# spirv-std-macros = { path = "F:/bin/rust-gpu/crates/spirv-std/macros", version = "*" }
