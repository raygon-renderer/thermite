[workspace]
members = ["bin/*", "crates/*"]
resolver = "3"

# Shared package metadata inherited by members via `field.workspace = true`.
# Keep publishable crates in lockstep on this version.
[workspace.package]
version = "0.2.0-beta.0"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
repository = "https://github.com/raygon-renderer/thermite"
homepage = "https://github.com/raygon-renderer/thermite"
authors = ["novacrazy <novacrazy@gmail.com>"]

[workspace.lints.rust]
unexpected_cfgs = { level = "allow", check-cfg = ['cfg(target_arch, values("spirv"))', 'cfg(tarpaulin_include)'] }

[profile.dev]
opt-level = 1

[profile.release]
opt-level = 3
codegen-units = 1
lto = true

[profile.bench]
opt-level = 3
lto = "fat"
codegen-units = 1
debug = false

[profile.release-ffi]
inherits = "release"
opt-level = 3
codegen-units = 1
lto = "fat"
debug = false
strip = true
panic = "abort"

[workspace.dependencies]
thermite-macros = { path = "crates/thermite-macros", version = "0.2.0-beta.0" }

thermite = { path = "crates/thermite", version = "0.2.0-beta.0", default-features = false }
thermite-special = { path = "crates/thermite-special", version = "0.2.0-beta.0", default-features = false }
thermite-geometry = { path = "crates/thermite-geometry", version = "0.2.0-beta.0", default-features = false }

spirv-builder = { version = "0.9.0" }
spirv-std-macros = { version = "0.9.0" }
