[workspace]
members = ["bin/*", "crates/*", "tests/*"]
default-members = [
    "crates/thermite",
    "crates/thermite-blas",
    "crates/thermite-compensated",
    "crates/thermite-complex",
    "crates/thermite-dual",
    "crates/thermite-geometry",
    "crates/thermite-interval",
    "crates/thermite-macros",
    "crates/thermite-sdf",
    "crates/thermite-sort",
    "crates/thermite-special",
    "tests/dispatch_dyn",
    "tests/wasm-runner",
]

# Someone complained about setting `resolver = "3"` in a workspace with 2024 edition members,
# but without it I get this warning, so I've added it back:
# `warning: virtual workspace defaulting to `resolver = "1"` despite one or more
#   workspace members being on edition 2024 which implies `resolver = "3"``
resolver = "3"

[workspace.package]
version = "0.2.1"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
repository = "https://github.com/raygon-renderer/thermite"
homepage = "https://github.com/raygon-renderer/thermite"
authors = ["novacrazy <novacrazy@gmail.com>"]

[workspace.lints.rust]
unexpected_cfgs = { level = "allow", check-cfg = ['cfg(target_arch, values("spirv"))', 'cfg(tarpaulin_include)', 'cfg(thermite_unstable_spirv)', 'cfg(thermite_legacy_map)'] }

[profile.dev]
opt-level = 1

[profile.release]
opt-level = 3
codegen-units = 1
lto = true

[profile.bench]
opt-level = 3
lto = "fat"
codegen-units = 1
debug = false

[profile.release-ffi]
inherits = "release"
opt-level = 3
codegen-units = 1
lto = "fat"
debug = false
strip = true
panic = "abort"

[workspace.dependencies]
# Exact pin: the macros emit code that references thermite internals, so the
# published pair must stay in lockstep (same reason serde pins serde_derive).
thermite-macros = { path = "crates/thermite-macros", version = "=0.2.1" }

thermite = { path = "crates/thermite", version = "0.2.1", default-features = false }
thermite-special = { path = "crates/thermite-special", version = "0.2.1", default-features = false }
thermite-geometry = { path = "crates/thermite-geometry", version = "0.2.1", default-features = false }
thermite-dual = { path = "crates/thermite-dual", version = "0.2.1", default-features = false }
thermite-compensated = { path = "crates/thermite-compensated", version = "0.2.1", default-features = false }
thermite-interval = { path = "crates/thermite-interval", version = "0.2.1", default-features = false }
thermite-complex = { path = "crates/thermite-complex", version = "0.2.1", default-features = false }
thermite-sort = { path = "crates/thermite-sort", version = "0.2.1", default-features = false }

spirv-builder = { version = "0.9.0" }
spirv-std-macros = { version = "0.9.0" }
