[package]
name = "thermite-compensated"
version = "0.1.0"
edition = "2024"

[features]
default = ["float-trait"]
float-trait = ["thermite/float-trait"]
special = ["dep:thermite-special"]

[dependencies]
thermite = { path = "../thermite" }
thermite-special = { path = "../thermite-special", optional = true }
fast_polynomial = { version = "0.4", default-features = false }
num-traits = { version = "0.2", default-features = false }
hexf = "0.2.1"
paste = "1"

[dev-dependencies]
libm = "0.2"
rand = "0.9.2"
