[package]
name = "thermite-compensated"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
description = "Double-double compensated arithmetic built on Thermite"
publish = false                                                        # not ready for release yet

[features]
default = ["special"]
special = ["dep:thermite-special"]
std = ["thermite/std"]

[dependencies]
thermite = { path = "../thermite", version = "0.2.0-beta.0" }
# thermite-macros = { path = "../thermite-macros" }
thermite-special = { path = "../thermite-special", version = "0.2.0-beta.0", optional = true }
fast_polynomial = { version = "0.4", default-features = false }
num-traits = { version = "0.2", default-features = false }
hexf = "0.2.1"
paste = "1"

[dev-dependencies]
libm = "0.2"
rand = "0.9.2"

[lints]
workspace = true
