[package]
name = "thermite-blas"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
description = "SIMD linear-algebra (BLAS-style) routines built on Thermite"
publish = false                                                             # not ready for release yet

[dependencies]
paste = "1"
thermite = { workspace = true }
fast_polynomial = { version = "0.4", default-features = false }
num-traits = { version = "0.2", default-features = false }
const-default = { version = "1.0.0", default-features = false }

[dev-dependencies]
rand = "0.9.2"
criterion = { version = "0.8", features = ["html_reports"] }


[[bench]]
name = "blas"
harness = false
