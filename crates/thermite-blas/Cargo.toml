[package]
name = "thermite-blas"
version = "0.1.0"
edition = "2024"

[dependencies]
paste = "1"
thermite = { path = "../thermite" }
fast_polynomial = { version = "0.4", default-features = false }
num-traits = { version = "0.2", default-features = false }
const-default = { version = "1.0.0", default-features = false }

[dev-dependencies]
rand = "0.9.2"
criterion = { version = "0.8", features = ["html_reports"] }


[[bench]]
name = "blas"
harness = false
