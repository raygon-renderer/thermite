[package]
name = "thermite-interval"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
description = "Rigorous SIMD interval arithmetic built on Thermite"
keywords = ["simd", "interval", "interval-arithmetic", "verified", "no-std"]
categories = ["mathematics", "science", "no-std", "hardware-support"]
readme = "README.md"
include = ["/src", "/README.md", "/LICENSE-APACHE", "/LICENSE-MIT"]

[features]
std = ["thermite/std"]
wasm = ["thermite/wasm"]
# `Dual<Interval<V>, N>`: derivative enclosures by the chain rule, and the
# `verify` module built on them (Krawczyk root certification).
dual = ["dep:thermite-dual"]

[[example]]
name = "krawczyk"
required-features = ["dual"]

[dev-dependencies]
thermite-compensated = { workspace = true, features = ["special"] }

[dependencies]
thermite = { workspace = true }
# Canonical error-free transforms (two_sum / Veltkamp-split two_prod): the
# residual widening tier must never silently lose its residual to a non-FMA
# `mul_adde` lowering, and compensated's ScalarValue already solved that.
thermite-compensated = { workspace = true }
thermite-dual = { workspace = true, optional = true }
num-traits = { version = "0.2", default-features = false }
paste = "1"

[lints]
workspace = true
