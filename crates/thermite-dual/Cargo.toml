[package]
name = "thermite-dual"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
description = "Forward-mode automatic differentiation (multidual numbers) built on Thermite"
keywords = ["simd", "autodiff", "dual-numbers", "gradient", "no-std"]
categories = ["mathematics", "science", "no-std", "hardware-support"]
readme = "README.md"
include = ["/src", "/README.md", "/LICENSE-APACHE", "/LICENSE-MIT", "/katex-header.html"]

[package.metadata.docs.rs]
features = ["std"]
rustdoc-args = ["--cfg", "docsrs", "--html-in-header", "katex-header.html"]

[features]
default = ["special"]
special = ["dep:thermite-special"]
# Lets a `Compensated` be the value of a `Dual`, i.e. `Dual<Compensated<V>, N>`:
# derivatives carried through double-double arithmetic.
compensated = ["dep:thermite-compensated"]
std = ["thermite/std"]

[dependencies]
thermite = { workspace = true }
thermite-special = { workspace = true, optional = true }
thermite-compensated = { workspace = true, optional = true }
num-traits = { version = "0.2", default-features = false }
paste = "1"

[dev-dependencies]
libm = "0.2"

[lints]
workspace = true
