[package]
name = "thermite-special"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
description = "Extended special functions for the Thermite SIMD library"
keywords = ["simd", "special-functions", "erf", "gamma", "math"]
categories = ["mathematics", "science", "no-std", "hardware-support"]
readme = "README.md"
include = ["/src", "/README.md", "/katex-header.html", "/LICENSE-APACHE", "/LICENSE-MIT"]

[package.metadata.docs.rs]
features = ["std"]
rustdoc-args = ["--cfg", "docsrs", "--html-in-header", "katex-header.html"]

[lints]
workspace = true

[features]
std = ["thermite/std"]
wasm = ["thermite/wasm"]                         # wasm32/wasm64 SIMD128 backend (needed to name it in tests)
disable_dispatch = ["thermite/disable_dispatch"] # Disable dispatch in thermite for maximum performance, but massive code bloat

[dependencies]
cfg-if = "1"
crunchy = "0.2"
thermite = { workspace = true }
paste = "1"
libm = { version = "0.2.15", default-features = false, features = ["arch"] }

[dev-dependencies]
lambert_w = "2.0.0"
image = { version = "0.25", default-features = false, features = ["png", "hdr"] }
# `special` is what carries their `SpecializedRealSpecialMath` impls, and the workspace
# entries are `default-features = false`, so it has to be asked for explicitly.
thermite-dual = { workspace = true, features = ["special"] }
thermite-compensated = { workspace = true, features = ["special"] }
thermite-complex = { workspace = true, features = ["special"] }

[target.'cfg(any(target_arch = "x86", target_arch = "x86_64", all(target_arch = "aarch64", target_env = "gnu")))'.dev-dependencies]
criterion = { version = "0.8", features = ["html_reports"] }

[[bench]]
name = "spherical_harmonics"
harness = false

[[bench]]
name = "langevin"
harness = false
