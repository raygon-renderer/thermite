[package]
name = "thermite"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
description = "High-performance, generic, ISA-portable SIMD library with a policy-configurable transcendental math library"
readme = "README.md"
keywords = ["simd", "vector", "math", "no-std", "performance"]
categories = ["no-std", "mathematics", "hardware-support"]
# Explicit allowlist so local scratch (examples/, benches/, test dumps) can
# never leak into the published .crate regardless of working-tree state.
include = ["/src", "/README.md", "/GUIDE.md", "/katex-header.html", "/LICENSE-APACHE", "/LICENSE-MIT"]

[lints]
workspace = true

[package.metadata.docs.rs]
features = ["document_registers", "std", "avx2-f16c"]
rustdoc-args = ["--cfg", "docsrs", "--html-in-header", "katex-header.html"]

[features]
default = ["document_registers", "bitvec", "avx2-f16c", "avx2-pclmul"]
bitvec = ["dep:bitvec", "generic-array/bitvec"]

document_registers = [] # Whether to document individual register abstractions

# NOTE: the historical `disable_fast_fma` feature was REMOVED once the emulated FMA
# became correctly rounded. On backends without hardware FMA, `mul_add` and family
# now lower to a round-to-odd emulation (Boldo-Melquiond 2008; `fmadd_ro` /
# `fmadd_widen_ro` in backend/generic/polyfills/math.rs) that is bit-identical to a
# true fused multiply-add for EVERY input, including subnormals, at every lane -
# fully vectorized, with no libm involvement. There is nothing left for the feature
# to trade: the fallback IS an FMA. (It was also strictly worse for f32, where the
# libm chain it selected carries a known subnormal-halfway double-rounding bug -
# rust-lang/compiler-builtins#1262.)

# Disable all static dispatch on the SIMD ISA, instead opting for an #[inline(always)] signatures.
# This will bloat code, and if you do not guarantee that the function will be inlined, it will be very slow.
# Only enable this feature if you know what you're doing.
disable_dispatch = []

# Ignore denormal values by default. There is a very slight overhead in checking and fixing them,
# but it's usually much less than the penalty of executing operations on denormal values. Only
# enable if you know your data is well-formed or the target arch automatically flushes to zero.
#
# Also compiles the subnormal machinery out of the emulated FMA on non-FMA backends
# (~20% faster mul_add there): normal-range results stay bit-identical to hardware FMA,
# but subnormal-scale products/results become faithfully rounded instead of exact -
# which is moot anyway on hardware actually running FTZ/DAZ, the usual reason to
# enable this. Ignored when `preserve_denormals` (or `strict_ieee754`) is enabled.
ignore_denormals = []

# Preserve denormal values, which can be very slow to operate on, but are required for strict IEEE-754 compliance.
# Only enable if you need to handle denormal values correctly, and are okay with the performance implications.
preserve_denormals = []

# Try to follow IEEE-754 exactly, even at the cost of performance.
#
# Many SIMD instructions intentionally ignore parts of the spec,
# and this will attempt to abide by the spec wherever possible.
#
# Unfortunately requires preserving all denormal inputs, so this mode will be
# significantly slower in some workloads. (The emulated FMA needs no special
# handling here: it is correctly rounded - bit-identical to hardware FMA -
# unconditionally.)
strict_ieee754 = ["preserve_denormals"]

# Unlock autovectorization on the scalar backend: the 1-lane `f32`/`f64` registers
# (and therefore every emulated `ArrayRegister` lane built on them) use LLVM's
# `algebraic_*` float ops instead of strict IEEE-754 `+ - * / %`.
#
# Strict scalar ops block vectorization of a loop written against the scalar
# backend entirely - LLVM may not reassociate the accumulator - so a reduction
# stays a serial `addss` dependency chain. The algebraic ops lift that, and pick
# up FMA contraction along the way.
#
# Scoped to the scalar backend on purpose. The SIMD backends issue ISA intrinsics
# whose semantics are already fixed, and the element layer stays strict so const
# evaluation and bit-exact helpers are unaffected.
#
# These ops carry all fast-math flags EXCEPT `nnan`/`ninf`, so NaN and infinity
# still behave; the optimizer may reassociate, contract into FMA, turn division
# into a reciprocal multiply, and ignore the sign of zero. What it costs is exact
# cancellation: `thermite-compensated` is incompatible outright (reassociation
# zeroes the error terms of `two_sum`/`two_prod`) and rejects this at compile
# time, and hand-written extended-precision splits elsewhere lose their guarantee.
#
# `strict_ieee754` overrides this feature rather than conflicting with it: the two
# ask for opposite things, and a feature-unified build can pick up both from
# unrelated crates in the graph, so asking for strictness wins and the scalar
# backend stays IEEE-754. `features::ALGEBRAIC_SCALAR` reports the resolved answer.
#
# For now this needs the `nightly` feature, which supplies the intrinsics. The
# equivalent `f32::algebraic_add` methods stabilize in 1.98, at which point
# `algebraic-scalar` works on stable with no code change.
algebraic-scalar = []

# Emit the scalar rounding fallbacks (`element::float::arch::soft`) out of line instead
# of inlining them at every call site. They are small integer-masking routines, so
# inlining lets them constant-fold and CSE - `floor(x) + floor(x)` becomes one body plus
# an add - at the cost of code size wherever they are reached (a `no_std` build whose
# baseline lacks SSE4.1, or a target with no explicit rung at all). Enable this to trade
# that back for size. No effect where a rung above `soft` supplies the operation.
outline_scalar_math = []

# Also enables fmt functionality for panicking functions. Additionally backs the last
# rung of the scalar float ladder (`element::float::arch`) with std's methods instead of
# `libm`: they lower to generic LLVM intrinsics, which ARE selected with the enclosing
# function's target features, so scalar math inside a `#[dispatch]` trampoline can still
# reach one instruction. Capability consts like `HAS_TRUE_FMA` stay baseline-gated
# regardless - std cannot promise which side of that it will land on.
std = ["num-traits/std"]
partial-ord = []         # Implements PartialOrd for Vector, only if all lanes are that order

# NOTE: there is deliberately no `neon` feature. NEON/AdvSIMD is mandatory in
# AArch64, so the backend is gated on `target_arch = "aarch64"` and is always
# compiled there -- nothing to opt into.

# Assume the `f16c` CPU feature is available whenever AVX2 is (the x86-v3 backend).
# F16C shipped one generation before AVX2 (Ivy Bridge vs. Haswell), so any AVX2-capable
# CPU also has F16C. This adds `f16c` to the `#[target_feature(enable = ...)]` set the
# dispatch macros emit for the AVX2 backend, so half-precision conversion intrinsics are
# available in dispatched code without a separate runtime check. No effect off x86.
avx2-f16c = ["thermite-macros/avx2-f16c"]

# Assume the `pclmulqdq` (carry-less multiply) CPU feature is available whenever AVX2 is
# (the x86-v3 backend). PCLMULQDQ shipped with Westmere (2010), well before AVX2 (Haswell,
# 2013), so any AVX2-capable CPU also has it. This adds `pclmulqdq` to the
# `#[target_feature(enable = ...)]` set the dispatch macros emit for the AVX2 backend, and
# enables the CLMUL-based 2D Morton (`morton::<2>`) fast path on u64-lane registers. No
# effect off x86.
avx2-pclmul = ["thermite-macros/avx2-pclmul"]

# Uses wasm32 or wasm64 backend, where wasm64 is only available on nightly (with "nightly" feature)
wasm = []

# UNDER CONSTRUCTION. Select which AVX-512 tier the x86-v4 backend compiles to.
# Exactly one v4 backend exists per build: the features chain, cargo feature
# unification resolves to the highest requested tier, and `DefaultAvx512`
# (backend/x86_v4/mod.rs) is assigned from it. Hardware below the compiled tier
# falls back to the x86-v3 (AVX2) backend at runtime dispatch.
#
# The backend has no registers yet, so today these compile the module skeleton
# and nothing selects it: `InstructionSet::get()` reports `X86V4` and the
# dispatch table still maps that rung onto `backend::x86_v3::X86V3` (see
# thermite-macros/src/dispatch.rs) - the widest working backend until v4 lands.
#
# There is no KNL (F+CD-only) tier: BW/DQ/VL are the ladder's floor, and
# F+CD-only hardware runs the AVX2 backend.
avx512-tier1 = ["thermite-macros/avx512-tier1"]                 # baseline AVX512 (Skylake-SP+): F+CD+BW+DQ+VL
avx512-tier2 = ["avx512-tier1", "thermite-macros/avx512-tier2"] # modern AVX512 (Ice Lake+): +VBMI/VBMI2/VNNI/BITALG/VPOPCNTDQ/IFMA/GFNI/VAES/VPCLMULQDQ
avx512-tier3 = ["avx512-tier2", "thermite-macros/avx512-tier3"] # cutting-edge AVX512 (Sapphire Rapids, Zen 4/5): +BF16

# EXPERIMENTAL, INCOMPLETE, and a HARD COMPILE ERROR in released versions.
#
# Consumers who want it must take a git dependency and pass
# `RUSTFLAGS='--cfg thermite_unstable_spirv'`.
spirv = ["nightly"]

# Nightly features
# Takes the top rung of the scalar float ladder (`core::intrinsics`), which supersedes
# the `std` rung entirely - same lowering, no std required.
nightly = []
# std_simd = ["nightly", "std"] # WIP

[dependencies]
cfg-if = { version = "1", default-features = false }
crunchy = "0.2"
thermite-macros = { workspace = true }
fast_polynomial = { version = "0.4", default-features = false }
generic-array = { version = "1.4.0" }
bitvec = { version = "1.0.1", default-features = false, optional = true }
const-default = { version = "1.0.0", default-features = false }
paste = "1.0.15"
hexf = "0.2.1"
num-traits = { version = "0.2.19", default-features = false }
rustversion = "1"
libm = { version = "0.2.13", default-features = false, features = ["arch"] }
rand = { version = "0.10", optional = true, default-features = false }

[target.'cfg(any(target_arch = "x86", target_arch = "x86_64"))'.dependencies]
thermite-macros = { workspace = true, features = ["x86"] }

# aarch64 only: 32-bit arm NEON intrinsics (and its `#[target_feature(enable = "neon")]`)
# are still unstable, and ARMv7 NEON lacks f64 lanes entirely.
[target.'cfg(target_arch = "aarch64")'.dependencies]
thermite-macros = { workspace = true, features = ["neon"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
thermite-macros = { workspace = true, features = ["wasm"] }

[target.'cfg(target_arch = "wasm64")'.dependencies]
thermite-macros = { workspace = true, features = ["wasm"] }

[target.'cfg(target_arch = "spirv")'.dependencies]
thermite-macros = { workspace = true, features = ["spirv"] }
spirv-std-macros.workspace = true

[dev-dependencies]
glam = "0.33"
rand = "0.10"
libm = "0.2.15"
num-traits = { version = "0.2.19", default-features = true }
image = { version = "0.25", default-features = false, features = ["png"] }

# Benchmark harness: criterion pulls rayon (refuses to build for wasi) and `alloca`
# (an unconditional `cc`-built C shim on unix/windows, NOT feature-trimmable), so it
# is gated to targets whose builds have a C toolchain:
#   - native x86 hosts (normal `cargo bench`)
#   - aarch64 *glibc* (`aarch64-unknown-linux-gnu`), built via `cross` in a container
#     that carries the C cross-toolchain (`just pi-bench-build`)
# The aarch64 *musl* target (test binaries for the Pi, `just pi-build`) deliberately
# has NO criterion so the pure-Rust test suite links with rust-lld alone. This means
# `cargo check --tests` for aarch64 must use the MUSL target on the bare host; the
# gnu target's dev graph now requires the C cross-toolchain (i.e. run under cross).
[target.'cfg(any(target_arch = "x86", target_arch = "x86_64", all(target_arch = "aarch64", target_env = "gnu")))'.dev-dependencies]
criterion = { version = "0.8", features = ["html_reports"] }
# Comparison libraries for the raytri bench only; keep them out of the non-x86
# build graph alongside criterion. simba (nalgebra's scalar abstraction) with
# the `wide` feature provides nalgebra's SIMD lane types.
nalgebra = "0.35"
simba = { version = "0.10", features = ["wide"] }

[[bench]]
name = "math"
harness = false

[[bench]]
name = "radixby"
harness = false

[[bench]]
name = "raytri"
harness = false
