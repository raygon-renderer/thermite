[package]
name = "thermite-macros"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
description = "Procedural codegen macros for the Thermite SIMD library (use via the thermite crate)"
readme = "README.md"
keywords = ["simd", "target-feature", "dispatch", "codegen", "proc-macro"]
categories = ["development-tools::procedural-macro-helpers", "hardware-support", "no-std"]

[lints]
workspace = true

[lib]
proc-macro = true

[dependencies]
syn = { version = "2", features = ["full", "extra-traits", "visit", "visit-mut"] }
quote = "1"
proc-macro2 = "1"

[features]
x86 = []
neon = []
wasm = []
spirv = []

# Assume the `f16c` CPU feature is available whenever AVX2 is (the x86-v3 backend).
# Adds `f16c` to the `#[target_feature(enable = ...)]` set emitted for the AVX2 backend
# by both `#[dispatch]` and `dispatch_dyn!`, enabling half-precision conversion
# intrinsics in dispatched code without a separate runtime detection step.
avx2-f16c = []

# Assume the `pclmulqdq` (carry-less multiply) CPU feature is available whenever AVX2 is.
# PCLMULQDQ shipped with Westmere (2010), three years before AVX2 (Haswell), so every
# AVX2-capable CPU has it. Adds `pclmulqdq` to the `#[target_feature(enable = ...)]` set
# emitted for the AVX2 backend, enabling the CLMUL-based 2D Morton fast path.
avx2-pclmul = []
