name: CI

on: [push, pull_request]

env:
  CARGO_TERM_COLOR: always
  RUSTUP_TOOLCHAIN: stable

  PKG_CORE: "-p thermite"

  PKGS_PUBLISHED: >-
    -p thermite-special
    -p thermite-dual
    -p thermite-compensated
    -p thermite-complex

  # Feature set for the wasm job.
  FEATURES_WASM: >-
    thermite/wasm
    thermite/std
    thermite-special/wasm
    thermite-compensated/wasm
    thermite-complex/wasm
    thermite-dual/special
    thermite-compensated/special
    thermite-complex/dual
    thermite-complex/special
    thermite-complex/compensated

jobs:
  test:
    name: Test (stable, std)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2

      - name: Run tests
        if: ${{ !contains(github.event.head_commit.message, '[skip tests]') }}
        run: cargo nextest run $PKG_CORE --features std

      - name: Run doctests
        run: cargo test $PKG_CORE --features std --doc

      - name: Check companion crates
        run: cargo check $PKGS_PUBLISHED

      # thermite-complex needs its optional features named explicitly: `dual`,
      # `special` and `compensated` gate the nested-storage impls, and more than
      # half its tests (64 of 116) only compile with them on. Package-qualified
      # (`crate/feature`) because the flag spans several `-p` packages.
      - name: Test companion crates
        if: ${{ !contains(github.event.head_commit.message, '[skip tests]') }}
        run: >
          cargo nextest run $PKGS_PUBLISHED
          --features thermite-complex/dual,thermite-complex/special,thermite-complex/compensated

      # The bench suite is x86-only kernels; not run here, just kept compiling.
      - name: Check benches build
        run: cargo check $PKG_CORE --benches

  # Runs the wasm-applicable suites for real on `wasm32-wasip1`, rather than
  # merely compile-checking the backend. This is the gate that would have caught
  # the signed `f64 -> i64` bias-unbias bug in the `_limited` cast polyfill,
  # which only the wasm backend uses and which turned `powf(2.1, -2.0)` into inf.
  #
  # No custom host needed: cargo's target runner is the stock wasmtime CLI, from
  # the Bytecode Alliance's own release binaries (`taiki-e/install-action`, the
  # same action nextest and llvm-cov already come from). `tests/wasm-runner` is
  # the local equivalent for `just wasm-test`; building its ~225-crate
  # wasmtime+cranelift tree on every CI run would be pure waste.
  #
  # `simd128`/`relaxed-simd` codegen flags come from `.cargo/config.toml`; the
  # runtime side needs no flag, since wasmtime has had relaxed-simd on by
  # default since v15 (and a module using it would fail validation, not
  # silently degrade, so the suite passing is proof it is enabled).
  wasm:
    name: Test (wasm32-wasip1)
    runs-on: ubuntu-latest
    if: ${{ !contains(github.event.head_commit.message, '[skip tests]') }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip1

      - name: Install wasmtime
        uses: taiki-e/install-action@wasmtime

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2

      # `--tests` excludes the criterion benches (native-only kernels). wasip1
      # has no threads, so libtest has to run single-threaded. LTO is forced off
      # because fat LTO is a known LLVM weak spot on 32-bit targets and buys
      # nothing for test binaries.
      - name: Run wasm test suite
        run: >
          cargo test $PKG_CORE $PKGS_PUBLISHED --no-default-features
          --features "$FEATURES_WASM"
          --target wasm32-wasip1 --tests -- --test-threads=1
        env:
          CARGO_TARGET_WASM32_WASIP1_RUNNER: wasmtime
          CARGO_PROFILE_RELEASE_LTO: "false"

  neon:
    name: Test (aarch64, NEON)
    runs-on: ubuntu-24.04-arm
    if: ${{ !contains(github.event.head_commit.message, '[skip tests]') }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2

      - name: Run tests
        run: cargo nextest run $PKG_CORE --features std

      - name: Run doctests
        run: cargo test $PKG_CORE --features std --doc

      - name: Test companion crates
        run: >
          cargo nextest run $PKGS_PUBLISHED
          --features thermite-complex/dual,thermite-complex/special,thermite-complex/compensated

  # thermite-ffi needs nightly and must be built in isolation (its
  # #[panic_handler] conflicts with any sibling that links std), so it gets
  # its own job. This is the compile-gate that would have caught the
  # decl_methods!/into_array regression; artifact builds stay in
  # ffi_artifacts.yaml.
  ffi:
    name: Check FFI (nightly)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@nightly

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2

      - name: Check thermite-ffi
        run: cargo check --profile release-ffi -p thermite-ffi
        env:
          RUSTUP_TOOLCHAIN: nightly

  # Skipped wholesale under `[skip tests]` - measuring coverage means running the
  # suite. The badge keeps whatever value the last measured commit published.
  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    if: ${{ !contains(github.event.head_commit.message, '[skip tests]') }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2

      # NOT `--all-features`: thermite's features select mutually exclusive
      # backends (spirv/neon/wasm/avx512-tier*/std_simd) that cannot co-compile on
      # x86_64. `--ignore-run-fail` still produces a number if an accepted
      # assertion fails - the `test` job above is the strict pass/fail gate.
      # `jq` is preinstalled on the ubuntu runners.
      - name: Measure coverage
        run: |
          cargo llvm-cov $PKG_CORE --features std --ignore-run-fail --json --summary-only > coverage.json
          COVERAGE=$(jq '.data[0].totals.lines.percent' coverage.json)
          COVERAGE=$(printf '%.1f' "$COVERAGE")
          echo "COVERAGE=$COVERAGE" >> "$GITHUB_ENV"
          echo "Line coverage: $COVERAGE%"

      # Only publish from pushes to the live branches. PRs (especially from forks)
      # cannot read GIST_SECRET, so the step is skipped there rather than failing.
      - name: Publish coverage badge
        if: github.event_name == 'push' && (github.ref == 'refs/heads/rewrite' || github.ref == 'refs/heads/master')
        uses: schneegans/dynamic-badges-action@v1.8.0
        with:
          auth: ${{ secrets.GIST_SECRET }}
          gistID: 7270c68e5927fa2a1ef2de9f4286010b
          filename: thermite-coverage.json
          label: coverage
          message: ${{ env.COVERAGE }}%
          valColorRange: ${{ env.COVERAGE }}
          minColorRange: 50
          maxColorRange: 95

  # Dispatch audit: every lib/bin/test/bench/example of the core and published
  # crates is built with --emit=llvm-ir (dev profile: the stricter audit, see
  # notes/thermite-audit) and scanned for kernels compiled without their
  # backend's target features. x86 only on purpose. NEON and simd128 are
  # baseline on the ARM and wasm jobs' targets, so the audit skips those.
  #
  # Opt-in: put `[audit]` in the commit message to run it. It costs a full
  # `--emit=llvm-ir` build of every target, so it is not worth paying on
  # every push. `head_commit` exists only for push events, so pull_request
  # runs never trigger it.
  audit:
    name: Dispatch audit (dev, x86)
    if: ${{ contains(github.event.head_commit.message, '[audit]') }}
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-thermite-audit
        run: cargo install --path bin/cargo-thermite-audit --locked

      - name: Audit thermite (all targets)
        run: cargo thermite-audit $PKG_CORE --all-targets --features std

      - name: Audit published crates (all targets)
        run: >
          cargo thermite-audit $PKGS_PUBLISHED --all-targets
          --features thermite-complex/dual,thermite-complex/special,thermite-complex/compensated
