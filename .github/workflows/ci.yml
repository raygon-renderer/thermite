name: CI

on: [push, pull_request]

env:
  CARGO_TERM_COLOR: always
  RUSTUP_TOOLCHAIN: stable

jobs:
  test:
    name: Test (stable, std)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest

      # Scoped to `-p thermite`: the rest of the workspace targets other ISAs
      # (spirv/neon/wasm) or is mid-rewrite, so a `--workspace` run won't build on
      # an x86_64 host. `std` is additive and lights up the fmt-gated panic paths.
      #
      # nextest schedules every test as its own process across all cores instead
      # of running each test binary to completion in turn. It deliberately does
      # not support doctests, so those get their own step - dropping it would
      # silently stop gating ~24 tests.
      - name: Run tests
        if: ${{ !contains(github.event.head_commit.message, '[skip tests]') }}
        run: cargo nextest run -p thermite --features std

      - name: Run doctests
        run: cargo test -p thermite --features std --doc

      # The wasm backend is build-only here (no SIMD128 runtime on the runner).
      - name: Check wasm backend builds
        run: |
          rustup target add wasm32-unknown-unknown
          cargo check -p thermite --target wasm32-unknown-unknown --no-default-features --features wasm

      # Compile-gate every companion, including the ones with no test suite of
      # their own (thermite-blas), since silent rot is how the FFI crate once
      # broke unnoticed. This runs even under `[skip tests]`.
      - name: Check companion crates
        run: >
          cargo check -p thermite-special -p thermite-sdf
          -p thermite-geometry -p thermite-dual -p thermite-compensated
          -p thermite-complex -p thermite-blas -p thermite-sort

      # ...and actually run their suites.
      #
      # thermite-complex needs its optional features named explicitly: `dual`,
      # `special` and `compensated` gate the nested-storage impls, and more than
      # half its tests (64 of 116) only compile with them on. Package-qualified
      # (`crate/feature`) because the flag spans several `-p` packages.
      - name: Test companion crates
        if: ${{ !contains(github.event.head_commit.message, '[skip tests]') }}
        run: >
          cargo nextest run
          -p thermite-special -p thermite-dual -p thermite-compensated
          -p thermite-complex -p thermite-sort -p thermite-sdf
          -p thermite-geometry
          --features thermite-complex/dual,thermite-complex/special,thermite-complex/compensated

      # The bench suite is x86-only kernels; not run here, just kept compiling.
      - name: Check benches build
        run: cargo check -p thermite --benches

  # thermite-ffi needs nightly and must be built in isolation (its
  # #[panic_handler] conflicts with any sibling that links std), so it gets
  # its own job. This is the compile-gate that would have caught the
  # decl_methods!/into_array regression; artifact builds stay in
  # ffi_artifacts.yaml.
  ffi:
    name: Check FFI (nightly)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@nightly

      - name: Check thermite-ffi
        run: cargo check --profile release-ffi -p thermite-ffi
        env:
          RUSTUP_TOOLCHAIN: nightly

  # Skipped wholesale under `[skip tests]` - measuring coverage means running the
  # suite. The badge keeps whatever value the last measured commit published.
  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    if: ${{ !contains(github.event.head_commit.message, '[skip tests]') }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      # NOT `--all-features`: thermite's features select mutually exclusive
      # backends (spirv/neon/wasm/avx512-tier*/std_simd) that cannot co-compile on
      # x86_64. `--ignore-run-fail` still produces a number if an accepted
      # assertion fails - the `test` job above is the strict pass/fail gate.
      # `jq` is preinstalled on the ubuntu runners.
      - name: Measure coverage
        run: |
          cargo llvm-cov -p thermite --features std --ignore-run-fail --json --summary-only > coverage.json
          COVERAGE=$(jq '.data[0].totals.lines.percent' coverage.json)
          COVERAGE=$(printf '%.1f' "$COVERAGE")
          echo "COVERAGE=$COVERAGE" >> "$GITHUB_ENV"
          echo "Line coverage: $COVERAGE%"

      # Only publish from pushes to the live branches. PRs (especially from forks)
      # cannot read GIST_SECRET, so the step is skipped there rather than failing.
      - name: Publish coverage badge
        if: github.event_name == 'push' && (github.ref == 'refs/heads/rewrite' || github.ref == 'refs/heads/master')
        uses: schneegans/dynamic-badges-action@v1.8.0
        with:
          auth: ${{ secrets.GIST_SECRET }}
          gistID: 7270c68e5927fa2a1ef2de9f4286010b
          filename: thermite-coverage.json
          label: coverage
          message: ${{ env.COVERAGE }}%
          valColorRange: ${{ env.COVERAGE }}
          minColorRange: 50
          maxColorRange: 95
