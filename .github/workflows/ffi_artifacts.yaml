name: Thermite FFI Build

on:
  push:
    branches: ["rewrite"]

jobs:
  build-artifacts:
    if: contains(github.event.head_commit.message, '[build ffi]')
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: libthermite.so
            archive_name: thermite-linux-x86_64.tar.gz
            rustflags: "-C link-arg=-nostdlib"
          # AArch64 runs the NEON backend, which is the only one there: AdvSIMD is
          # mandatory in the architecture, so there is nothing to detect and no
          # scalar rung underneath it.
          #
          # musl refuses to emit a `cdylib` while `crt-static` is on, hence the
          # override. It costs nothing: the crate references no libc, so the
          # resulting shared object has no `DT_NEEDED` entries and no undefined
          # symbols at all (the verification step below enforces that).
          - os: ubuntu-latest
            target: aarch64-unknown-linux-musl
            artifact_name: libthermite.so
            archive_name: thermite-linux-aarch64.tar.gz
            rustflags: "-C target-feature=-crt-static"
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: thermite.dll
            archive_name: thermite-windows-x86_64.zip
            rustflags: "-C link-arg=-nostdlib"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@nightly
        with:
          targets: ${{ matrix.target }}

      # `.cargo/config.toml` points this target at `rust-lld` so no external
      # cross-toolchain is needed, but rustup keeps that binary inside the
      # toolchain rather than on `PATH`.
      - name: Put rust-lld on PATH
        if: matrix.target == 'aarch64-unknown-linux-musl'
        run: echo "$(rustc --print sysroot)/lib/rustlib/$(rustc --print host-tuple)/bin" >> "$GITHUB_PATH"

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Install cbindgen
        run: cargo install cbindgen

      - name: Generate C Header
        run: cbindgen -q --config crates/thermite-ffi/cbindgen.toml --crate thermite-ffi --output thermite.h

      - name: Build the shared library
        run: cargo build --profile release-ffi -p thermite-ffi --target ${{ matrix.target }}
        env:
          RUSTFLAGS: ${{ matrix.rustflags }}

      # The library is `no_std` and touches no C runtime, which is only worth
      # claiming if it stays true. A stray `copy_nonoverlapping` is enough to pull
      # in `memcpy`, and with no `DT_NEEDED` there is nothing to resolve it from.
      - name: Verify the shared object is self-contained
        if: matrix.target == 'aarch64-unknown-linux-musl'
        run: |
          set -euo pipefail
          SO="target/${{ matrix.target }}/release-ffi/${{ matrix.artifact_name }}"
          echo "--- dynamic section ---"
          readelf -d "$SO"
          if readelf -d "$SO" | grep -q 'NEEDED'; then
            echo "::error::$SO links against a shared library; it should need none"
            exit 1
          fi
          UNDEF="$(readelf -W --dyn-syms "$SO" | awk '$7 == "UND" && $8 != "" { print $8 }')"
          if [ -n "$UNDEF" ]; then
            echo "::error::$SO has undefined symbols: $UNDEF"
            exit 1
          fi
          echo "OK: no DT_NEEDED entries, no undefined symbols"

      - name: Package artifacts
        shell: bash
        run: |
          mkdir -p staging
          cp target/${{ matrix.target }}/release-ffi/${{ matrix.artifact_name }} staging/
          cp thermite.h staging/
          cd staging
          if [[ "${{ matrix.os }}" == "windows-latest" ]]; then
            cp ../target/${{ matrix.target }}/release-ffi/thermite.dll.lib ./

            ../crates/thermite-ffi/tools/mpress.exe -s thermite.dll

            7z a ../${{ matrix.archive_name }} *
          else
            tar -czf ../${{ matrix.archive_name }} *
          fi

      - name: Upload Artifact to Workflow Run
        uses: actions/upload-artifact@v4
        with:
          # Keyed on the target, not the OS: two entries build on ubuntu-latest
          # and would otherwise overwrite each other.
          name: thermite-${{ matrix.target }}
          path: ${{ matrix.archive_name }}
