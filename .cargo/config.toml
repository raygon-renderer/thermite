# Codegen config for running thermite's test suite on wasm.
#
# The wasm backend's SIMD intrinsics need the `simd128` proposal enabled, and its
# `*_relaxed_swizzle` / `*_relaxed_laneselect` paths need `relaxed-simd`. These are
# target-scoped, so they only affect `--target wasm32-wasip1` builds; native x86 builds are
# untouched.
#
# The test *runner* (which executes each compiled libtest binary under wasmtime) is wired via
# the `CARGO_TARGET_WASM32_WASIP1_RUNNER` env var in the `just wasm-test` recipe, not here, so
# no machine-specific path is committed.
[target.wasm32-wasip1]
rustflags = ["-Ctarget-feature=+simd128,+relaxed-simd"]

# Cross-compiling the NEON test suite for ARM hardware (Raspberry Pi 3 B+ and
# any other 64-bit ARM Linux box). musl + rust-lld needs no external GNU
# cross-toolchain on the Windows host, and the fully static binaries run on
# any 64-bit distro regardless of its glibc. Built by `just pi-build`, pushed
# to the device manually (see that recipe's notes).
[target.aarch64-unknown-linux-musl]
linker = "rust-lld"
rustflags = ["-Ctarget-feature=+crt-static"]

# The `spirv` feature is a hard compile error unless `thermite_unstable_spirv` is
# set, so released versions cannot pull in the unfinished backend. Development on
# it continues here, and the backend only ever compiles for `target_arch = "spirv"`
# anyway, so scoping the opt-in to that target lets `bin/spirv_testing` build with
# no extra flags while leaving every native build untouched.
[target.'cfg(target_arch = "spirv")']
rustflags = ["--cfg", "thermite_unstable_spirv"]
